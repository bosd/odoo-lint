name: Release

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]
  # Publishes the VS Code extension only (publish_vscode), e.g. after its
  # version changed between releases.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-drafter:
    if: github.event_name == 'push'
    name: Draft Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Draft Release
        uses: release-drafter/release-drafter@c2e2804cc59f45f57076a99af580d0fedb697927 # v7.3.0
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release assets for editors (the Zed extension downloads them through
  # Zed's API). Releases are immutable once published, so the assets go into
  # the draft while the version in Cargo.toml has no release yet; each push
  # replaces them.
  asset-plan:
    if: github.event_name == 'push'
    needs: release-drafter
    name: Check whether the draft needs assets
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Is the version released?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" --silent 2>/dev/null; then
            echo "v${version} is released; no assets to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} has no release yet; building its assets"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build_assets:
    needs: asset-plan
    if: needs.asset-plan.outputs.build == 'true'
    name: Build asset ${{ matrix.asset }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runs-on: ubuntu-latest,
              target: x86_64,
              manylinux: auto,
              asset: odl-x86_64-unknown-linux-gnu.tar.gz,
            }
          - {
              runs-on: ubuntu-24.04-arm,
              target: aarch64,
              manylinux: auto,
              asset: odl-aarch64-unknown-linux-gnu.tar.gz,
            }
          - {
              runs-on: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              manylinux: musllinux_1_2,
              asset: odl-x86_64-unknown-linux-musl.tar.gz,
            }
          - {
              runs-on: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-musl,
              manylinux: musllinux_1_2,
              asset: odl-aarch64-unknown-linux-musl.tar.gz,
            }
          - {
              runs-on: windows-latest,
              target: x86_64,
              manylinux: "off",
              asset: odl-x86_64-pc-windows-msvc.zip,
            }
          - {
              runs-on: macos-15-intel,
              target: x86_64,
              manylinux: "off",
              asset: odl-x86_64-apple-darwin.tar.gz,
            }
          - {
              runs-on: macos-latest,
              target: aarch64,
              manylinux: "off",
              asset: odl-aarch64-apple-darwin.tar.gz,
            }
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          args: --release --locked --out dist
          sccache: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
      - name: Pack odl from the wheel
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: python scripts/release_asset.py pack dist/*.whl "$ASSET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asset-${{ matrix.asset }}
          path: ${{ matrix.asset }}

  upload_assets:
    needs: build_assets
    name: Put the assets into the draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true
      - name: Replace the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '[.[] | select(.draft)][0].id // empty')"
          if [ -z "$draft" ]; then
            echo "::error::No draft release to put the assets into"
            exit 1
          fi
          for file in assets/*; do
            name="$(basename "$file")"
            old="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${draft}/assets" --jq ".[] | select(.name == \"${name}\") | .id")"
            if [ -n "$old" ]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old}"
            fi
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${draft}/assets?name=${name}" > /dev/null
            echo "uploaded ${name}"
          done

  check-version:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Compare versions
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "${TAG_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $TAG_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  verify_assets:
    needs: check-version
    name: Check the release has its assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Compare with the expected assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          missing="$(comm -23 <(python3 scripts/release_asset.py names | sort) \
            <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name' | sort))"
          if [ -n "$missing" ]; then
            echo "::error::$TAG_NAME was published without these assets (immutable now): $missing"
            exit 1
          fi

  build_wheels:
    name: Build wheel ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runs-on: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - {
              runs-on: ubuntu-latest,
              target: x86_64-unknown-linux-musl,
              manylinux: musllinux_1_2,
            }
          - {
              runs-on: ubuntu-24.04-arm,
              target: aarch64-unknown-linux-musl,
              manylinux: musllinux_1_2,
            }
          - { runs-on: windows-latest, target: x86_64, manylinux: "off" }
          - { runs-on: macos-15-intel, target: x86_64, manylinux: "off" }
          - { runs-on: macos-latest, target: aarch64, manylinux: "off" }
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          args: --release --locked --out dist
          # No build cache in release builds: avoids cache poisoning.
          sccache: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-wheels-${{ matrix.runs-on }}-${{ matrix.target }}
          path: dist/*.whl

  build_sdist:
    name: Build source distribution
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  publish_release:
    name: Sign and Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/odoo-linter
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download the wheels and the sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Only the dists: a re-run must not pick up the signatures an
          # earlier attempt uploaded.
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
          # Releases are immutable once published, so nothing can be attached
          # to them here: keep the signatures as a workflow artifact.
          release-signing-artifacts: false
          upload-signing-artifacts: true
      - name: Remove sigstore files before publishing to PyPI
        run: rm -f dist/*.sigstore dist/*.sigstore.json
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  publish_crate:
    name: Publish to crates.io
    # Publish the crate only once the PyPI release succeeded, so both
    # registries carry the same version.
    needs: publish_release
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/odoo-lint
    permissions:
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  publish_mcp:
    name: Publish to the MCP Registry
    # The registry checks the PyPI release for the server's name (in the
    # README), so the PyPI release comes first.
    needs: publish_release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install mcp-publisher
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Set the version in server.json
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          # PyPI spells 0.1.0-alpha.5 as 0.1.0a5.
          pypi_version="$(echo "$version" | sed 's/-alpha\./a/; s/-beta\./b/; s/-rc\./rc/')"
          jq --arg v "$version" --arg p "$pypi_version" \
            '.version = $v | .packages[0].version = $p' server.json > server.json.new
          mv server.json.new server.json
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish

  publish_npm:
    name: Publish the dsh bundle to npm
    # bin/odl pins this release of odoo-linter, so PyPI comes first.
    needs: publish_release
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsh-odoo-lint
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later; Node 24 has it.
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish with trusted publishing
        working-directory: integrations/dsh
        run: |
          version="$(jq -r .version package.json)"
          if npm view "dsh-odoo-lint@$version" version >/dev/null 2>&1; then
            echo "dsh-odoo-lint $version is already on npm"
            exit 0
          fi
          # npm wants a tag for prereleases; until 0.1.0 every release is one.
          npm publish --access public --tag latest

  publish_vscode:
    name: Publish the VS Code extension
    # The extension has a version of its own (no prerelease tags on the
    # marketplaces); a version that is already published is skipped.
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: open-vsx
      url: https://open-vsx.org/extension/bosd/odoo-lint
    permissions:
      contents: read
      # Open VSX trusted publishing exchanges the OIDC token for a short-lived one.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Build the .vsix
        working-directory: integrations/vscode
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx vsce package --no-dependencies -o odoo-lint.vsix
      - name: Publish to Open VSX (trusted publishing)
        working-directory: integrations/vscode
        run: npx ovsx publish --packagePath odoo-lint.vsix --skip-duplicate --trusted-publishing
      - name: Publish to the Visual Studio Marketplace
        working-directory: integrations/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::No VSCE_PAT secret: not publishing to the Visual Studio Marketplace"
            exit 0
          fi
          npx vsce publish --packagePath odoo-lint.vsix --skip-duplicate
