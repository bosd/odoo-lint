name: Release

on:
  push:
    branches:
      - main
      - master
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-drafter:
    if: github.event_name == 'push'
    name: Draft Release Notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Draft Release
        uses: release-drafter/release-drafter@c2e2804cc59f45f57076a99af580d0fedb697927 # v7.3.0
        with:
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-version:
    if: github.event_name == 'release' && github.event.action == 'published'
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Compare versions
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "${TAG_NAME#v}" != "$version" ]; then
            echo "::error::Release tag $TAG_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  build_wheels:
    name: Build wheel ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runs-on: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runs-on: windows-latest, target: x86_64, manylinux: "off" }
          - { runs-on: macos-15-intel, target: x86_64, manylinux: "off" }
          - { runs-on: macos-latest, target: aarch64, manylinux: "off" }
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: stable
          args: --release --locked --out dist
          # No build cache in release builds: avoids cache poisoning.
          sccache: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.runs-on }}-${{ matrix.target }}
          path: dist/*.whl

  build_sdist:
    name: Build source distribution
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_release:
    name: Sign and Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/odoo-lint
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload
          "$TAG_NAME" ./dist/*
          --repo "$GITHUB_REPOSITORY"
      - name: Remove sigstore files before publishing to PyPI
        run: rm -f dist/*.sigstore dist/*.sigstore.json
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  publish_crate:
    name: Publish to crates.io
    # Publish the crate only once the PyPI release succeeded, so both
    # registries carry the same version.
    needs: publish_release
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/odoo-lint
    permissions:
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
