id = "odoo-lint-lsp"
name = "odoo-lint"
description = "Odoo linting: pylint-odoo and OCA checks as you type, with quick fixes"
version = "0.1.1"
schema_version = 1
authors = ["bosd"]
repository = "https://github.com/bosd/odoo-lint"

[language_servers.odoo-lint]
name = "odoo-lint"
# XML and PO come from the `xml` and `po` extensions of the registry.
languages = ["Python", "XML", "PO"]
