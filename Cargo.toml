[package]
name = "odoo-lint"
version = "0.1.0-alpha.8"
edition = "2021"
rust-version = "1.97"
authors = ["bosd"]
description = "Blazing fast Rust-native linter for Odoo modules"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bosd/odoo-lint"
homepage = "https://github.com/bosd/odoo-lint"
keywords = ["odoo", "linter", "static-analysis", "python"]
categories = ["command-line-utilities", "development-tools"]
include = ["/src/**/*.rs", "/src/**/*.html", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]
default-run = "odl"

[[bin]]
name = "odl"
path = "src/main.rs"

# Runs `odl`; for `uvx odoo-linter`, as MCP clients start the PyPI package.
[[bin]]
name = "odoo-linter"
path = "src/bin/odoo-linter.rs"

[dependencies]
comrak = { version = "=0.54.0", default-features = false }
clap = { version = "4.4", features = ["derive"] }
ruff_python_parser = "0.0.16"
ruff_python_ast = "0.0.16"
ruff_source_file = "0.0.16"
ruff_text_size = "0.0.16"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rayon = "1.8"
walkdir = "2.4"
quick-xml = "0.31"
globset = "0.4"
serde_json = "1"
regex = "1"
fancy-regex = "0.14"
similar = "2"
lsp-server = "0.7"
lsp-types = "0.95"
roxmltree = "0.21.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
